# ══════════════════════════════════════════════════════════════════════════
# Weiterleitungen für rl1.network
#
# WARUM DIESE DATEI EXISTIERT
#
# Die alte Seite hatte die Meldungen unter /news/, die neue hat sie unter
# /resources/news/. Eine dieser alten Adressen ist nicht irgendeine:
#
#     https://rl1.network/news/rl1-launch/
#
# Sie liefert heute HTTP 200, steht in den Google-Ergebnissen zu
# "Regulated Layer One" und ist die Adresse, auf die die Pressewelle vom
# 28. Juli 2026 verweist (The Defiant, CryptoBriefing, crypto.news,
# Cryptonomist und weitere). Im neuen Export gibt es unter diesem Pfad
# keine Datei mehr — ohne die Regeln unten antwortet sie nach dem
# Deployment mit 404, und die einzige rankende Unterseite der Domain ist
# weg.
#
# EINBINDEN (nginx):  include /etc/nginx/snippets/redirects.conf;  im server-Block,
#                     VOR dem location / mit try_files.
#
# Läuft kein nginx: die Apache-Fassung steht unten im Kommentar. Für jeden
# anderen Server gilt dasselbe in seiner Syntax — entscheidend ist nur,
# dass es echte 301 sind und keine Meta-Refresh-Seiten.
# ══════════════════════════════════════════════════════════════════════════

# ── Der kritische Fall ────────────────────────────────────────────────────
location = /news/rl1-launch/ { return 301 /resources/news/rl1-launch/; }
location = /news/rl1-launch  { return 301 /resources/news/rl1-launch/; }

# ── Verschobene Übersichts- und Kapitelseiten ─────────────────────────────
# Diese drei liegen im Export aktuell noch als Meta-Refresh-Seiten mit
# noindex. Sobald die Regeln hier greifen, können sie aus app/ entfernt
# werden (app/news/, app/ecosystem/, app/resources/press-kit/) — eine
# serverseitige 301 überträgt Signale, eine Meta-Refresh-Seite kaum.
location = /news/               { return 301 /resources/news/; }
location = /news                { return 301 /resources/news/; }
location = /ecosystem/          { return 301 /about/; }
location = /ecosystem           { return 301 /about/; }
location = /resources/press-kit/ { return 301 /resources/; }
location = /resources/press-kit  { return 301 /resources/; }

# ── Adressen der alten Einseiten-Version ──────────────────────────────────
# Die alte Startseite führte Participants / Governance / Use Cases /
# Express Interest in der Navigation. Das waren Sprungmarken auf der
# Startseite, keine eigenen Seiten — sie antworten heute schon mit 404.
# Sollten sie irgendwo verlinkt worden sein, fangen diese Regeln sie auf:
location = /participants      { return 301 /about/#network; }
location = /governance        { return 301 /about/#governance; }
location = /use-cases         { return 301 /#use-cases; }
location = /express-interest  { return 301 /join/; }


# ══════════════════════════════════════════════════════════════════════════
# APACHE-FASSUNG (.htaccess oder vhost) — falls kein nginx läuft.
#
# Der Live-Server antwortet heute mit `Server: HTTP Server`, also NICHT mit
# der nginx-Konfiguration aus diesem Repo. Vermutlich ist das hier die
# relevante Fassung.
#
#   Redirect 301 /news/rl1-launch/   /resources/news/rl1-launch/
#   Redirect 301 /news/rl1-launch    /resources/news/rl1-launch/
#   Redirect 301 /news/              /resources/news/
#   Redirect 301 /news               /resources/news/
#   Redirect 301 /ecosystem/         /about/
#   Redirect 301 /ecosystem          /about/
#   Redirect 301 /resources/press-kit/ /resources/
#   Redirect 301 /resources/press-kit  /resources/
#   Redirect 301 /participants       /about/
#   Redirect 301 /governance         /about/
#   Redirect 301 /use-cases          /
#   Redirect 301 /express-interest   /join/
#
# Achtung: Apache-`Redirect` hängt den Rest des Pfades an. Deshalb muss
# /news/rl1-launch/ VOR /news/ stehen — sonst landet die Pressemitteilung
# auf /resources/news/rl1-launch/ nur zufällig richtig, und jede spätere
# Unterseite von /news/ läuft ins Leere.
# ══════════════════════════════════════════════════════════════════════════
