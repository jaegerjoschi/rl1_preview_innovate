# ══════════════════════════════════════════════════════════════════════════
# Sicherheits-Header für rl1.network — NUR Header, keine location-Blöcke.
#
# Die Seite wird statisch ausgeliefert (next build → Ordner out/). Es läuft
# kein Node-Prozess, der Header setzen könnte — diese Datei gehört deshalb
# in die Konfiguration des Webservers.
#
# Stand 13.09.2026 liefert rl1.network KEINEN einzigen dieser Header aus
# (geprüft mit curl -I; der Server meldet sich als "HTTP Server", ist also
# nicht das nginx aus diesem Repo). Zum Vergleich: salesforce.com setzt
# HSTS, X-Content-Type-Options, Referrer-Policy und X-Frame-Options.
#
# ── WARUM HIER KEINE location-BLÖCKE MEHR STEHEN ─────────────────────────
#
# Zwei nginx-Eigenheiten, die vorher beide zugeschlagen haben:
#
# 1. Das offizielle nginx-Image bindet /etc/nginx/conf.d/*.conf automatisch
#    INNERHALB von `http { }` ein. Diese Datei lag dort — mit location-
#    Blöcken darin. `location` ist im http-Kontext nicht erlaubt, nginx
#    verweigert dann den Start. Die Datei liegt jetzt unter
#    /etc/nginx/snippets/ (siehe Dockerfile) und wird ausdrücklich
#    eingebunden, statt eingesammelt zu werden.
#
# 2. `add_header` in einem location-Block verwirft SÄMTLICHE geerbten
#    add_header der übergeordneten Ebene. Jeder location-Block, der ein
#    eigenes Cache-Control setzt, hätte damit alle Sicherheits-Header
#    weggeworfen — still, ohne Fehlermeldung. Deshalb steht das Caching
#    jetzt in nginx.conf bei den Locations, und jede dieser Locations
#    bindet diese Datei zusätzlich ein.
#
# Einbinden:  include /etc/nginx/snippets/security-headers.conf;
#             im server-Block UND in jedem location-Block mit add_header.
# ══════════════════════════════════════════════════════════════════════════

# ── Verbindung erzwingen ──────────────────────────────────────────────────
# Der Browser spricht die Domain zwei Jahre lang nur noch über HTTPS an und
# lässt sich nicht auf HTTP herunterhandeln.
# preload erst ergänzen, wenn ALLE Subdomains sicher HTTPS können.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ── Einbettung in fremde Seiten verhindern (Clickjacking) ─────────────────
# frame-ancestors wirkt nur als echter Header, nicht als Meta-Tag —
# deshalb steht es hier und nicht in der Seite selbst.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;

# ── MIME-Type-Raten unterbinden ───────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;

# ── Wie viel Herkunft beim Weiterklicken mitgeht ──────────────────────────
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Browser-Funktionen abschalten, die die Seite nicht braucht ────────────
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# ══════════════════════════════════════════════════════════════════════════
# HINWEIS zur Content-Security-Policy
#
# Die vollständige CSP steht als Meta-Tag in app/layout.tsx, weil sie so mit
# der Seite versioniert ist und beim Deployen nicht vergessen werden kann.
# Hier steht nur frame-ancestors, weil genau diese Direktive als Meta-Tag
# wirkungslos ist.
#
# Die CSP enthält script-src 'unsafe-inline'. Das ist beim statischen Export
# unvermeidbar: Next.js legt die Hydration-Daten in Inline-Skripte, und für
# die saubere Alternative (ein pro Anfrage neu erzeugter Nonce) bräuchte es
# einen Server, den es hier bewusst nicht gibt.
#
# Das Restrisiko ist gering, weil die Seite keine Nutzereingaben verarbeitet
# und keine fremden Skripte einbindet. Sollte später ein Join-Formular mit
# Server-Verarbeitung dazukommen, ist das der Zeitpunkt, auf Nonces
# umzustellen — dann existiert auch der Server dafür.
# ══════════════════════════════════════════════════════════════════════════
