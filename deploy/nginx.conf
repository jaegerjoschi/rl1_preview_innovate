# ══════════════════════════════════════════════════════════════════════════
# Serverblock für die statisch exportierte Seite.
#
# trailingSlash ist in next.config.ts aktiv: jede Route liegt als
# /pfad/index.html im Export. Diese Konfiguration bildet das ab.
#
# Die Sicherheits-Header liegen in deploy/security-headers.conf und werden
# hier an JEDER Stelle eingebunden, die ein eigenes add_header setzt —
# siehe die Begründung in jener Datei (nginx vererbt add_header nicht,
# sobald eine Ebene eigene setzt).
# ══════════════════════════════════════════════════════════════════════════

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Verrät die nginx-Version nicht im Antwort-Header
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  # ── Weiterleitungen der alten Adressen ──────────────────────────────────
  #
  # MUSS vor dem `location /` weiter unten stehen. Bei nginx entscheidet
  # zwar nicht die Reihenfolge in der Datei, sondern die Spezifität — die
  # Regeln dort sind alle `location =` und gewinnen damit ohnehin gegen das
  # Prefix `/`. Die Reihenfolge hier ist trotzdem die lesbare: Wer die
  # Datei von oben liest, sieht die Umleitungen, bevor er die Auslieferung
  # sieht.
  #
  # Ohne diese Datei antwortet /news/rl1-launch/ nach dem Deployment mit
  # 404 — die Begründung steht ausführlich in redirects.conf.
  include /etc/nginx/snippets/redirects.conf;

  # ── Kompression ─────────────────────────────────────────────────────────
  #
  # ACHTUNG, hier saß der teuerste Fehler der ganzen Konfiguration:
  # Hier stand nur `application/javascript`. Seit nginx 1.21.1 liefert die
  # mitgelieferte mime.types Dateien mit der Endung .js aber als
  # `text/javascript` aus — und was nicht in gzip_types steht, wird nicht
  # komprimiert. Das Ergebnis war JavaScript ungezippt auf dem Draht:
  # 594 KB statt 183 KB, bei jedem einzelnen Erstaufruf.
  #
  # text/html fehlt in der Liste bewusst: nginx komprimiert diesen Typ
  # immer und lässt sich nicht davon abbringen. Ihn zu nennen ist ein
  # Konfigurationsfehler, den nginx mit einer Warnung quittiert.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  # Liefert eine daneben liegende .gz-Datei aus, statt bei jeder Anfrage neu
  # zu komprimieren. Beim statischen Export ist das geschenkt: der Inhalt
  # steht zur Build-Zeit fest, `node scripts/precompress.mjs` erzeugt die
  # Dateien mit maximaler Stufe. Fehlt eine .gz-Datei, greift gzip oben.
  gzip_static on;

  # ── Gehashte Build-Artefakte ────────────────────────────────────────────
  #
  # Alles unter /_next/static/ trägt einen Hash im Namen: ändert sich der
  # Inhalt, ändert sich der Name. Diese Dateien dürfen dauerhaft im Cache
  # bleiben.
  #
  # Das `^~` ist nicht Kosmetik, sondern der Kern der Sache: nginx prüft
  # Regex-Locations VOR einfachen Prefix-Locations, unabhängig von der
  # Reihenfolge in der Datei. Ohne `^~` gewann die Datei-Endungs-Regel
  # weiter unten, und die gehashten Schriften bekamen eine Woche Cache
  # statt eines Jahres. `^~` bricht die Regex-Prüfung ab, sobald der
  # Prefix passt.
  location ^~ /_next/static/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ── Bilder, Schriften, Downloads aus public/ ────────────────────────────
  # Diese Namen tragen KEINEN Hash — eine Woche mit Revalidierung, damit ein
  # ausgetauschtes Bild nicht monatelang hängen bleibt.
  location ~* \.(?:jpe?g|png|gif|avif|webp|svg|ico|woff2?|pdf)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
  }

  # ── Alles Übrige: die HTML-Seiten ───────────────────────────────────────
  #
  # Vorher stand die HTML-Regel als `location ~* \.html$`. Die hat nie
  # gegriffen: geprüft wird die angefragte URI, nicht die Datei, die
  # try_files daraus macht. Bei trailingSlash lautet die URI "/" oder
  # "/about/" — ohne Endung. Die Seiten gingen damit ganz ohne
  # Cache-Control raus, und Browser und Proxys wendeten ihre eigene
  # Heuristik an. Genau das, was die Regel verhindern sollte.
  #
  # Jetzt hängt die Regel an der Location, die die Seiten tatsächlich
  # ausliefert.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # /pfad → /pfad/index.html, ohne dass die Adresszeile springt
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;

  location = /404.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    internal;
  }
}
